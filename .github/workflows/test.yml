name: Test

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
      - name: Install check tools
        shell: pwsh
        run: |
          go install github.com/hashicorp/packer-plugin-sdk/cmd/packer-sdc@v0.6.13
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Force -Scope CurrentUser
          powershell.exe -NoProfile -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module Pester -RequiredVersion 5.6.1 -Force -Scope CurrentUser -SkipPublisherCheck"
      - name: Check generated schema
        run: |
          go generate ./provisioner
          git diff --exit-code -- provisioner/config.hcl2spec.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        run: ./scripts/test.ps1
      - name: Verify plugin protocol
        run: go run . describe

  snapshot:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Determine Packer plugin API version
        run: |
          go build -o "$RUNNER_TEMP/packer-plugin-windows-cleanup" .
          API_VERSION=$("$RUNNER_TEMP/packer-plugin-windows-cleanup" describe | jq -er '.api_version | select(type == "string" and length > 0)')
          echo "API_VERSION=$API_VERSION" >> "$GITHUB_ENV"
      - name: Build unsigned snapshots
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --snapshot --skip=publish,sign --clean
      - name: Archive snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-snapshots
          path: dist/
          if-no-files-found: error
