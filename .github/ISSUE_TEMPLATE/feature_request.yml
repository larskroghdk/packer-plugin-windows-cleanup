name: Feature request
description: Suggest a cleanup operation, validation check or option.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        New destructive operations need explicit configuration, a documented legacy or Microsoft source, dry-run behavior, reporting and tests. Proposals that widen deletion roots, run arbitrary commands, or make the provisioner shut down or generalize the guest are out of scope. See [Safety and reports](https://github.com/larskroghdk/packer-plugin-windows-cleanup/blob/main/docs/safety.md).
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Cleanup operation
        - Validation check
        - Configuration option
        - Report output
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and why the plugin doesn't support it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, including the configuration you would write.
    validations:
      required: true
  - type: textarea
    id: windows-versions
    attributes:
      label: Windows versions
      description: Which supported guests (Server 2016, 2019, 2022 or 2025; Windows 10 1607 or later; Windows 11) and installation types (Server Desktop Experience, Server Core or client) does this apply to?
  - type: textarea
    id: safety
    attributes:
      label: Sources and safety
      description: For cleanup, give exact paths or mechanism, a Microsoft or legacy source, what to preserve, and dry-run output. Note impact on reboot or servicing, WinRM and builder-owned Sysprep finalizer staging.
